services:
  ipradar:
    build: .
    image: ipradar:latest
    ports:
      - "127.0.0.1:${IPRADAR_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: true
      - path: .env.local
        required: false
    volumes:
      - ipradar-data:/app/data
      # ── 一键更新(可选):取消注释并补 token 才解锁 /api/update ──
      # 挂 docker.sock = 容器获得宿主机 root 级控制,仅限内网自托管
      # - /var/run/docker.sock:/var/run/docker.sock
      # - ./:/app/repo
      # ↓ environment 是 service 层键(与 volumes/env_file 平级),取消注释时移到 service 缩进层
      # environment:
      #   IP_RADAR_SELF_UPDATE: "1"
      #   IP_RADAR_UPDATE_TOKEN: "改成随机串"
      #   IP_RADAR_REPO_DIR: /app/repo
      #   IP_RADAR_COMPOSE_FILE: /app/repo/docker-compose.yml
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/api/db-status', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s   # HTTP 现秒级可达(warming 期 db-status 返 200);60s 留慢机余量
volumes:
  ipradar-data:
