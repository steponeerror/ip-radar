# backend/pytest.ini — pytest 配置(2026-11-03 起,retro P1-5)。
# 此前全仓无 pytest 配置(rootdir 靠 cwd 自动推导);本件只为注册 env_dep
# marker,rootdir 对 README「Tests」节的用法(cd backend && pytest)不变。
#
# env_dep 打标规则(保守准入):
#   只给「有证据的环境依赖用例」打标——真凭证、活服务、外网真跑、花钱真
#   模型;无该环境的机器/worktree 上这些用例必红或必跳,与代码回归无关。
#   每处标记旁必须留 why 注释。仓内测试的 urlopen/requests 已全数
#   patch/mock(2026-11-03 rg 实证),默认不因网络缺场而红;不确定的不打。
#
# 使用:scripts/pytest-ipradar --no-env-dep(= -m 'not env_dep')。
# 归因纪律:任何红先同跑 baseline(同一用例在主检出/CI 是否同红),
# 归因到环境再措辞,别当回归修。
[pytest]
markers =
    env_dep: 依赖外部环境(真凭证/活服务/花钱真模型);无该环境必红或跳,-m 'not env_dep' 退场
