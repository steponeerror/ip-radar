name: CI

on:
  push:
    branches: [master, demo]   # demo = 生产分支,push 面同样过 CI(CI-F1)
    tags: ['v*']        # tag push 也跑构建验证(spec Changes Checklist)
    paths-ignore: ["**.md", "assets/**", "LICENSE"]  # 纯文档/图片变更不跑 5 分钟 CI
  pull_request:
    paths-ignore: ["**.md", "assets/**", "LICENSE"]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"   # 对齐 Dockerfile node:22-alpine(CI-F4)
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npx eslint src   # CI-F5:lint 入闸(strictNullChecks 已开,0 错 0 例外)
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  backend:
    # needs frontend: SPA fallback tests assert on frontend/dist contents
    needs: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Tests — core/ per-file (known cross-file state pollution, see #17)
        run: |
          for f in tests/core/test_*.py; do
            echo "::group::$f"
            python -m pytest "$f" -q || exit 1
            echo "::endgroup::"
          done
      - name: Tests — remaining suites whole-dir
        run: python -m pytest tests/eval tests/evidence tests/lookup tests/source_infra tests/sources tests/auth tests/alerts -q   # auth/alerts 入闸(R3-F1);本地整目录合跑无跨文件污染
      - name: Bit-identity smoke (R3-F2①) — bench_lookup snapshot/compare round-trip
        run: ../scripts/ci_bitidentity_smoke.sh
      - name: Full suite in one process (reference only — flake tracking, do not gate)
        run: python -m pytest tests -q
        continue-on-error: true
      - name: Dependency audit (pip-audit)
        run: |
          pip install pip-audit
          pip-audit --skip-editable
        continue-on-error: true # informative for a security tool, does not gate

  docker:
    # validates the artifact users actually deploy: docker compose up -d --build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ipradar:ci .
      # CI-F2: 入口/compose 面回归 —— compose YAML 解析错也红(不止 build 绿)。
      # .env 是被跟踪的安全默认文件(checkout 即有,真密钥走 gitignored .env.local),
      # 故无需 touch 即可 config。
      - name: Compose file sanity (CI-F2)
        run: docker compose config -q
      # CI-F2: 运行面健康门 —— 生产式端口/env:镜像自带 ENTRYPOINT(uvicorn :8000)
      # + ENV IP_RADAR_DATA_DIR=/app/data,compose 默认部署的 env 面即镜像默认
      # (其余 environment 块全为注释态),裸 run 即对齐生产默认面。
      - name: Runtime health — run image & poll /api/version (CI-F2)
        run: |
          docker run -d --name ipradar-ci -p 127.0.0.1:8000:8000 ipradar:ci
          trap 'docker rm -f ipradar-ci >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 60); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/version || true)"
            if [ "$code" = "200" ]; then
              echo "healthy: /api/version 200 after ~${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::/api/version did not return 200 within 60s"
          docker logs ipradar-ci
          exit 1
      # CI-F3: tag↔CHANGELOG↔GitHub Release 三真相源一致性(分支 push/PR 跳过)。
      # 版本头格式为 `## vX.Y.Z — YYYY-MM-DD`,故锚 tag 名 + 边界(空格|行尾),
      # 兼顾 v1.4.1 不误吞 v1.4.10。漏打 tag → 更新横幅死;漏建 Release → 通知死:失败即红。
      - name: Tag↔CHANGELOG↔Release consistency (CI-F3)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}   # workflow 顶 permissions: contents: read 足够 release view
        run: |
          grep -qE "^## ${GITHUB_REF_NAME}( |$)" CHANGELOG.md \
            || { echo "::error::CHANGELOG.md has no '## ${GITHUB_REF_NAME}' section"; exit 1; }
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null \
            || { echo "::error::GitHub Release ${GITHUB_REF_NAME} missing"; exit 1; }
