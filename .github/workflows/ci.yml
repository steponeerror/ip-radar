name: CI

on:
  push:
    branches: [master, demo]   # demo = 生产分支,push 面同样过 CI(CI-F1)
    tags: ['v*']        # tag push 也跑构建验证(spec Changes Checklist)
    paths-ignore: ["assets/**", "LICENSE"]  # 纯图片/LICENSE 变更不跑 5 分钟 CI;**.md 不再忽略——STANDARD.md/GLOSSARY.md 变更须过 standard-check 审计门(终审修单 M5:md 全忽略曾使审计门恰在自家目标变更上永不运行)
  pull_request:
    paths-ignore: ["assets/**", "LICENSE"]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"   # 对齐 Dockerfile node:22-alpine(CI-F4)
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npx eslint src   # CI-F5:lint 入闸(strictNullChecks 已开,0 错 0 例外)
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1
      # T6(2026-10-19): ops 标准答案集回归探针(golden cases)——faux provider 跑真 agent 回路,零 API 花费;
      # 自带 fixture 判例树,不依赖嵌套 docs 仓(T1 docs skip 判例同型问题不存在),仅依赖
      # node+npm 供给(本 job 已具备)+rg(ubuntu runner 预装,兜底 apt 装)。真模型 smoke 层
      # 单列不进 CI(计划书 Task 6 Step 2)。沙箱断言面对 checkout 干净仓(同 仓内 step 均落 ignore 面)。
      - name: Ops agent golden set (faux, no API spend)
        working-directory: ops/agent
        run: |
          command -v rg >/dev/null 2>&1 || sudo apt-get install -y -q ripgrep
          npm ci --no-fund --no-audit
          node golden/run-golden.mjs
      # T2(2026-10-20): selftest 伞面入闸(架构审查 R3 候选 2)——lib.sh 四函数/语义门
      # 24+ 例单测/prompt↔工具面同步闸/spawn 契约三层,此前全靠手跑。供给已就绪:
      # node+node_modules(golden 步 npm ci 沉淀)/rg(上步守卫)/python3+curl+git
      # (ubuntu-latest 自带,§7 feed fixture 用 http.server)。§1/§2/§6 真实 docs 仓
      # 依赖断言在 CI checkout 无嵌套 docs 仓 → SKIP 行显式计 PASS
      # (test_precedent_schema.py 同型)。§10 会再跑一遍 golden(faux,秒级)——
      # 接受重复,不加条件分支:伞面绿=全部绿。
      - name: Ops agent selftest (lib.sh + gate units + contract)
        working-directory: ops/agent
        run: bash selftest.sh
      # 说人话闸单测(pi 扩展 plain-language-gate 的纯扫描函数):词表语义与
      # ~/.pi/agent/scripts/check_plain_language.py 逐条对齐,防两侧漂移
      # (2026-11-03 黑话复发诊断的机制腿)。node ≥22.18 默认剥类型。
      - name: Plain-language gate unit tests
        working-directory: .
        run: node --test scripts/test_plain_language_gate.mjs
      # #305:bash 工具软提醒扩展单测(curl 外链/apt/npm -g/pip 关键词纯函数,
      # 内网与 venv 白名单;同上 node ≥22.18 默认剥类型直 import .ts)
      - name: Bash tool reminder unit tests
        working-directory: .
        run: node --test scripts/test_bash_tool_reminder.mjs

  backend:
    # needs frontend: SPA fallback tests assert on frontend/dist contents
    needs: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Tests — core/ per-file (known cross-file state pollution, see #17)
        run: |
          for f in tests/core/test_*.py; do
            echo "::group::$f"
            python -m pytest "$f" -q || exit 1
            echo "::endgroup::"
          done
      - name: Tests — remaining suites whole-dir
        run: python -m pytest tests/eval tests/evidence tests/lookup tests/source_infra tests/sources tests/auth tests/alerts -q   # auth/alerts 入闸(R3-F1);本地整目录合跑无跨文件污染
      # 源数字闸(ADR 0018 机器比对腿):登记表(_sources/ 目录自动发现 + _tokens.py
      # MANAGED)派生 公开源/免钥/带钥/密钥变量 四数,与 README(双语)/MANUAL(双语)/
      # CONTEXT/GLOSSARY 文档宣称数比对,不符即红。stdlib-only,秒级,零新依赖;
      # 单测整目录入闸 pytest ../scripts(评审 P2-3:防检查器被改坏成恒绿而 CI 无感;
      # #304② 起 probe-egress 单测与 honyport acceptance/aggregate 两件随目录收进闸,
      # 不再点名单文件)。
      - name: Source-count doc gate (ADR 0018)
        run: |
          python ../scripts/check_source_counts.py
          python -m pytest ../scripts -q
      - name: Bit-identity smoke (R3-F2①) — bench_lookup snapshot/compare round-trip
        run: ../scripts/ci_bitidentity_smoke.sh
      # #304③:全量单进程参考跑 tee 留档——下一少一非门控步从 pytest 输出提取 SKIP 计数
      # 打进 job 摘要(docs 嵌套仓缺席的静默 skip 判例形=tests/ 根 test_precedent_schema.py
      # 模块级 skip,只被本全量跑碰到,门控两步不碰它,故只 tee 本步);pipefail 保
      # pytest 退出码照常呈现,continue-on-error 语义不变(不改变现有门控判定)。
      - name: Full suite in one process (reference only — flake tracking, do not gate)
        run: set -o pipefail && python -m pytest tests -q 2>&1 | tee "$RUNNER_TEMP/pytest-fullsuite.log"
        continue-on-error: true
      # #304③:SKIP 计数可见性件——本身不持门(if: always + grep 宽容,无输出也不红);
      # 计数含全量跑内一切 skip(不止 docs 缺席),汇总行原文并列供人判成因。
      - name: Pytest SKIP count to job summary (docs-repo absence visibility, not a gate)
        if: always()
        run: |
          log="$RUNNER_TEMP/pytest-fullsuite.log"
          {
            echo "## Pytest SKIP 计数(docs 嵌套仓缺席可见性;不持门)"
            echo
            if [ -f "$log" ]; then
              skipped="$(grep -oE '[0-9]+ skipped' "$log" | awk '{s+=$1} END{print s+0}')"
              echo "- 全量单进程参考跑 skipped 合计: ${skipped}"
              echo "- pytest 汇总行原文:"
              echo '```'
              grep -E '[0-9]+ (passed|failed|error|skipped)' "$log" || echo "(未捕获到 pytest 汇总行)"
              echo '```'
            else
              echo "- (全量参考步未运行或未留档,无可计)"
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Dependency audit (pip-audit)
        run: |
          pip install pip-audit
          pip-audit --skip-editable
        continue-on-error: true # informative for a security tool, does not gate

  docker:
    # validates the artifact users actually deploy: docker compose up -d --build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ipradar:ci .
      # CI-F2: 入口/compose 面回归 —— compose YAML 解析错也红(不止 build 绿)。
      # .env 是被跟踪的安全默认文件(checkout 即有,真密钥走 gitignored .env.local),
      # 故无需 touch 即可 config。
      - name: Compose file sanity (CI-F2)
        run: docker compose config -q
      # CI-F2: 运行面健康门 —— 生产式端口/env:镜像自带 ENTRYPOINT(uvicorn :8000)
      # + ENV IP_RADAR_DATA_DIR=/app/data,compose 默认部署的 env 面即镜像默认
      # (其余 environment 块全为注释态),裸 run 即对齐生产默认面。
      - name: Runtime health — run image & poll /api/version (CI-F2)
        run: |
          docker run -d --name ipradar-ci -p 127.0.0.1:8000:8000 ipradar:ci
          trap 'docker rm -f ipradar-ci >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 60); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/version || true)"
            if [ "$code" = "200" ]; then
              echo "healthy: /api/version 200 after ~${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::/api/version did not return 200 within 60s"
          docker logs ipradar-ci
          exit 1
      # CI-F3: tag↔CHANGELOG↔GitHub Release 三真相源一致性(分支 push/PR 跳过)。
      # 版本头格式为 `## vX.Y.Z — YYYY-MM-DD`,故锚 tag 名 + 边界(空格|行尾),
      # 兼顾 v1.4.1 不误吞 v1.4.10。漏打 tag → 更新横幅死;漏建 Release → 通知死:失败即红。
      - name: Tag↔CHANGELOG↔Release consistency (CI-F3)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}   # workflow 顶 permissions: contents: read 足够 release view
        run: |
          grep -qE "^## ${GITHUB_REF_NAME}( |$)" CHANGELOG.md \
            || { echo "::error::CHANGELOG.md has no '## ${GITHUB_REF_NAME}' section"; exit 1; }
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null \
            || { echo "::error::GitHub Release ${GITHUB_REF_NAME} missing"; exit 1; }
